name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # v1.13.8: this used to be a hand-listed subset, so a pull request was gated by a
      # weaker list than a release. That is the same defect release:verify itself had --
      # a gate that does not run everything reports green anyway -- so the pull request
      # now runs the one list, and `verify:gate-coverage` inside it fails if a suite or
      # script is reachable from no step.
      - name: Release verification (the one gate list)
        run: npm run release:verify
      - name: Coverage-gated test run
        run: npm run test:coverage
