name: Release Verify

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run release verification
        run: npm run release:verify
      - name: Upload BUILD-MANIFEST.json
        uses: actions/upload-artifact@v4
        with:
          name: build-manifest
          path: dist/BUILD-MANIFEST.json
