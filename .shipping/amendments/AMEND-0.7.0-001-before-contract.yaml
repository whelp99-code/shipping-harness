  "blockerPolicy": [
    "acceptance-failure",
    "contract-tamper",
    "stale-evidence",
    "scope-drift",
    "critical-security",
    "human-stop-override",
    "runtime-authority-escalation",
    "runtime-unbounded-value",
    "runtime-receipt-tamper",
    "runtime-session-takeover",
    "runtime-late-result",
    "runtime-fabricated-success",
    "runtime-public-publish",
    "runtime-license-boundary",
    "runtime-rollback-failure",
    "missing-real-pilot"
  ],
  "budgets": {
    "maxFixCycles": 2,
    "maxAgentRuns": 3,
    "maxCommandSeconds": 900,
    "maxOutputBytes": 1048576
  },
  "goal": "Delegate bounded personal/company-internal execution to the verified private OMO runtime while Shipping retains exclusive authority over scope, approval, budgets, human stop, evidence, blockers, SHIPPABLE, and CLOSED.",
  "project": "shipping-harness",
  "release": "0.7.0",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "schema": "shipping-harness/v1",
  "scope": {
    "include": [
      "A narrow Shipping Core bridge to the separately pinned shipping-harness-omo-runtime without importing the OMO monorepo into Shipping Core.",
      "Signed shipping-omo/v1 work orders and shipping-omo-receipt/v1 receipts bound to release, contract hash, Git SHA, session, Goal/Task, scope, acceptance, and bounded budgets.",
      "Truthful runtime health, compatibility, exact upstream/internal pins, build digest, notices, modification inventory, install evidence, canary evidence, promotion, and rollback evidence.",
      "Shipping-owned pause, abort, budget, stale-SHA, foreign-session, forbidden-path, late-result, receipt-integrity, issue, verification, and Finisher decisions.",
      "At most two workers, depth one, three continuations, two fix cycles, Team and DAG disabled, no unlimited values, no public publishing.",
      "Contract-approved Codex/Generic fallback or durable BLOCKED when the private runtime is unavailable or incompatible.",
      "One disposable but real Git project completed through an actual OMO-backed probe/work-order receipt followed by independent Shipping acceptance verification and CLOSED receipt.",
      "A v0.7 pilot report containing completion, intervention, cost/usage, coordination, stop, false-done, and entry-gate evidence for v0.8."
    ],
    "exclude": [
      "OMO source copied into Shipping Core or distributed from the Shipping package.",
      "Team Mode, DAG orchestration, more than two parallel workers, delegation depth above one, unlimited values, or evolutionary loops.",
      "Customer installation, public npm/source/binary/image/container publication, public SaaS, public listeners, marketplace, or external tenant access.",
      "Remote/mobile control, organization RBAC, backup service, v0.9 operations, or v1.0 schema freeze.",
      "OMO memory, reflection, telemetry, self-update, branding changes, or model-provider credential migration.",
      "Treating OMO task completion as release completion without current Shipping verification."
    ],
    "paths": {
      "include": [
        "packages/internal-omo-bridge/**",
        "config/upstreams/**",
        "scripts/omo-*.mjs",
        "test/omo/**",
        "test/adversarial/**",
        "docs/internal-runtime/**",
        "docs/planning/**",
        "docs/TRACEABILITY.md",
        "README.md",
        "BACKLOG.md",
        "THIRD_PARTY.md",
        "package.json",
        "src/mcp/tools.mjs",
        "src/mcp/resources.mjs",
        "src/core/contract.mjs"
      ],
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "dist/**",
        "coverage/**",
        "node_modules/**",
        "../shipping-harness-omo-runtime/**"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness",
  "internalRuntime": {
    "schema": "shipping-harness/private-runtime-profile-v1",
    "profile": "private-omo-v0.7",
    "configPath": "config/upstreams/omo-pin.json",
    "workOrderSchema": "shipping-omo/v1",
    "receiptSchema": "shipping-omo-receipt/v1",
    "fallback": [
      "codex",
      "generic",
      "blocked"
    ],
    "humanStopWins": true,
    "shippingFinisherOnly": true,
    "publicPublish": false,
    "teamMode": false,
    "dagMode": false,
    "maxParallelWorkers": 2,
    "maxAgentDepth": 1,
    "maxContinuations": 3,
    "maxFixCycles": 2
  }
}
