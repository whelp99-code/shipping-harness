  ],
  "adapters": {
    "codex": {
      "artifactPaths": [],
      "command": null
    },
    "gajae": {
      "artifactPaths": [],
      "command": null
    },
    "generic": {
      "artifactPaths": [],
      "command": null
    },
    "omo": {
      "artifactPaths": [],
      "command": null
    },
    "ouroboros": {
      "artifactPaths": [],
      "command": null
    }
  },
  "blockerPolicy": [
    "acceptance-failure",
    "contract-tamper",
    "stale-evidence",
    "scope-drift",
    "data-loss",
    "critical-security",
    "human-stop-override",
    "automatic-approval",
    "model-self-approval",
    "raw-command-surface",
    "public-listener",
    "false-user-state",
    "hidden-blocker",
    "unbounded-card-content",
    "installer-path-escape",
    "destructive-migration",
    "migration-without-rollback",
    "unsupported-schema-accepted",
    "compatibility-fabrication",
    "terminal-state-replay",
    "internal-boundary-violation",
    "missing-handover",
    "missing-fallback-renderer"
  ],
  "budgets": {
    "maxAgentRuns": 3,
    "maxCommandSeconds": 600,
    "maxFixCycles": 2,
    "maxOutputBytes": 1048576
  },
  "goal": "Explain mixed-stack projects and current work concretely, require acceptance coverage for every product change, and isolate side-effecting package verification from the source worktree.",
  "project": "shipping-harness",
  "release": "1.3.0",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "requirements": [
    "REQ-INTEL-001",
    "REQ-INTEL-002",
    "REQ-COVER-001",
    "REQ-COVER-002",
    "REQ-ISOLATE-001",
    "REQ-ISOLATE-002"
  ],
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Executing product deployment, external services, paid actions, production migrations, or Git mutation in target projects.",
      "Overriding the explicit user goal with an inferred work theme or auto-approving an inferred scope.",
      "Unbounded semantic analysis or reading untracked secrets/content for theme inference.",
      "A tenth MCP tool, OMP core/model-router changes, Team/DAG, public publication, or public listeners."
    ],
    "include": [
      "Build a bounded path-based component graph and identify primary/supporting stacks from tracked repository evidence.",
      "Group changed product paths into one to three evidence-backed work themes and recommend a concrete release goal without overriding the explicit user goal.",
      "Map every blocking product/release-evidence path to authority-bearing acceptance commands and exact cwd; uncovered paths force NEEDS_ACCEPTANCE.",
      "Annotate acceptance commands with side-effect class, isolation requirement, and deterministic-output requirement where applicable.",
      "Run side-effecting package/release acceptance in a temporary Git worktree or isolated copy and compare repeat output digests without mutating the source worktree.",
      "Expose a bounded one-screen approval summary while preserving expandable detailed evidence.",
      "Run a non-destructive real EvoHarvest planning pilot and preserve OMP 18.0.10, nine MCP tools, human approval, and all prior guarantees."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "dist/**",
        "coverage/**",
        "node_modules/**",
        "docs/reports/**"
      ],
      "include": [
        "README.md",
        "docs/MCP.md",
        "docs/COMPATIBILITY.md",
        "docs/TRACEABILITY.md",
        "docs/planning/02-REQUIREMENTS.md",
        "docs/planning/23-V1.3.0-PROJECT-INTELLIGENCE-AND-ACCEPTANCE-COVERAGE-DEVELOPMENT-PLAN.md",
        "package.json",
        "src/core/project-analysis.mjs",
        "src/core/project-intelligence.mjs",
        "src/core/isolated-verification.mjs",
        "src/core/baseline.mjs",
        "src/core/decision-evidence.mjs",
        "src/core/proposal-state.mjs",
        "src/core/proposals.mjs",
        "src/mcp/tools.mjs",
        "src/mcp/user-view.mjs",
        "packages/shipping-plugin/manifest/plugin.json",
        "packages/shipping-plugin/skill/SKILL.md",
        "packages/stable-control/compatibility.mjs",
        "schemas/v1/examples/plugin.example.json",
        "scripts/evoharvest-intelligence-pilot.mjs",
        "test/mcp/project-intelligence.test.mjs",
        "test/mcp/baseline-steward.test.mjs",
        "test/mcp/nested-workspace-refine.test.mjs",
        "test/mcp/omp-compatibility.test.mjs",
        "test/integration/isolated-acceptance.test.mjs"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness"
}
