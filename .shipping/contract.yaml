  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Any command, approval, closure, deployment, model, external-write, public, customer, cost, data, authentication, security, license, or RELEASED authority in Goal Charter.",
      "New MCP tools, raw shell or arbitrary command fields, background workers, public listeners, or automatic deployment.",
      "Paperthin runtime or skill-catalog dependency, OMO Team/DAG activation, or Ouroboros-style infinite mutation of the current version.",
      "Changing an ACCEPTED Goal Charter in place or reopening a CLOSED release.",
      "Weakening existing scope, acceptance, rollback, blocker, unknown, pause, abort, Release Train, or Autopilot gates.",
      "Mutating real pilot repositories, Git push, merge, public publish, purchase, customer contact, credential changes, or production deployment."
    ],
    "include": [
      "Compile one deterministic PROPOSED Goal Charter from a ready bounded direction and critic.",
      "Persist one ACCEPTED Goal Charter only during successful exact scope approval.",
      "Bind the accepted charter to proposal, revision, proposal hash, Git SHA, contract hash, baseline SHA, Release Train hash, approver, and acceptance time.",
      "Record the accepted Goal Charter hash in the append-only Decision Ledger and approved Release Train binding.",
      "Expose the same Goal Charter through proposal, refine, approve, status, user view, plain brief, resources, and OMP without adding a tool.",
      "Reject stale, tampered, foreign, weakened, or silently mutated charters and require a new proposal for authority-bearing direction changes.",
      "Add stable schemas, runtime-authentic examples, unit, integration, adversarial, performance, disposable, and real-project read-only evidence.",
      "Update requirements, traceability, compatibility, handover, security inventory, beginner, MCP, OMP, and operations documentation.",
      "Package and close v1.8.0 only after all current-Git Shipping gates pass."
    ],
