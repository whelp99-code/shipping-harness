  "goal": "Allow the owner to securely control explicitly allowlisted Shipping projects from trusted web and mobile clients over authenticated encrypted internal transport, with replay protection, auditable approvals, notifications, and proven backup and restore, while exposing no arbitrary shell, public listener, or customer surface.",
  "project": "shipping-harness",
  "release": "0.9.0",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Anonymous, public-internet, customer, multi-tenant, billing, SLA, or public SaaS access.",
      "Remote arbitrary shell, executable, command, argv, environment, working-directory, provider credential, raw path execution, contract-byte editing, budget expansion, policy override, push, merge, deploy, or purchase fields.",
      "Remote authority that can outrank local human pause or abort, reopen CLOSED work, replay terminal work, or fabricate recovery when runtime ownership evidence is missing.",
      "Public OMO runtime exposure, public listeners, automatic DNS or firewall changes, or automatic internet exposure.",
      "Team/DAG implementation or v1.0 schema-stability, migration-compatibility, benchmark, and final-installation work."
    ],
    "include": [
      "An owner/company-internal HTTPS gateway bound only to loopback or private network addresses and requiring TLS certificate and key material.",
      "Short-lived authenticated actor requests signed with bounded HMAC credentials, exact project allowlists, per-action permissions, timestamp checks, nonce replay protection, rate limits, payload limits, and audit request IDs.",
      "High-level Shipping status, start, exact proposal approval, pause, resume, abort, verify, close, blocker/evidence summary, notification, backup, restore, and health operations only.",
      "Signed approval receipts bound to actor, project, release, proposal ID and hash, current Git SHA, expiry, nonce, and one-time consumption where applicable.",
      "Deduplicated approval-required, BLOCKED, PAUSED, and CLOSED notifications whose delivery failure cannot mutate Shipping authority state.",
      "Integrity-signed backup and restore of Shipping contracts, locks, state, Goal and Task snapshots, ledgers, issues, backlog, proposals, evidence, release receipts, runtime pins, and minimum non-terminal private OMO ownership state.",
      "Restore-to-paused and terminal-non-replay rules, cross-project isolation, upgrade, rollback, incident runbooks, health evidence, and one real local HTTPS mobile/web-style pilot against a disposable allowlisted repository.",
      "Regression, adversarial, package, security, license, backup and restore, restart, and pilot evidence sufficient to close v0.9.0 with zero blockers.",
      "The distributable build includes the existing packages and config trees and marks the internal remote CLI executable; this is packaging of the locked v0.9 behavior, not new product scope."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "dist/**",
        "coverage/**",
        "node_modules/**",
        "packages/stable-control/**",
        "test/stable/**",
        "test/adversarial/stable-control-attacks.test.mjs",
        "scripts/v1-**",
        "docs/SECURITY-INVENTORY.md",
        "packages/internal-omo-bridge/stable.mjs"
      ],
      "include": [
        "bin/shipping-harness-remote.mjs",
        "packages/internal-remote/**",
        "scripts/remote-acceptance.mjs",
        "scripts/remote-gateway-smoke.mjs",
        "scripts/security-check.mjs",
        "test/remote/**",
        "test/adversarial/remote-attacks.test.mjs",
        "docs/internal-remote/**",
        "docs/operations/**",
        "docs/reports/v0.9-remote-pilot.json",
        "docs/reports/v0.9-remote-pilot.md",
        "config/internal-remote.example.json",
        "README.md",
        "THIRD_PARTY.md",
        "docs/MCP.md",
        "package.json",
        "scripts/build.mjs",
        "scripts/amend-v09-packaging-scope.mjs"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness"
