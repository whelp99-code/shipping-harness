  "scope": {
    "exclude": [
      "Long consultancy-style or technical implementation interviews.",
      "Model-authored question, answer, candidate, critic, direction, approval, verification, close, or release authority.",
      "Automatic destructive, data, authentication, security, privacy, legal, license, cost, production, public, customer, credential, or external consequences.",
