      "A small comparison record for direct Shipping, v0.7 private OMO, and v0.8 Team/DAG marked NOT_RUN/DISABLED when the entry gate fails.",
      "Regression evidence that fallback, pause, evidence, and Finisher authority remain unchanged.",
      "Package, documentation, traceability, and release receipts for the disabled decision."
    ],
    "exclude": [
      "Team/DAG graph compiler, team members, graph execution, node retry, graph amendment, role routing, or multi-agent orchestration code.",
