  "schema": "shipping-harness/v1",
  "scope": {
    "include": [
      "Add a deterministic one-to-five-version release-train compiler from explicit outcome and existing Shipping authority evidence.",
      "Add value, entry, exit, rollback, replan, risk, authority, and rolling-detail gates for every train release.",
      "Bind the first train release exactly to the current proposal release, contract, Git SHA, scope, and acceptance.",
      "Expose train preview through shipping_start, shipping_refine, shipping_status, plain brief, and OMP without adding an MCP tool.",
      "Persist the exact approved train atomically and bind it to proposal hash, contract hash, and baseline SHA.",
      "Add stable schema/example, migration-safe projection, deterministic hashing, Korean summary, docs, and traceability.",
      "Add clean, dirty, nested, monorepo, weak-acceptance, insufficient-value, stale, and hostile-model verification.",
      "Update version and compatibility surfaces to v1.5.0 after all focused tests pass."
    ],
    "exclude": [
      "Automatic implementation, automatic close, automatic next-version activation, production release, push, merge, deploy, purchase, or customer communication.",
      "A tenth MCP tool, raw commands, free-form future paths, model-authored authority, or speculative distant implementation tasks.",
      "Changing canonical proposal/release state, evidence freshness, blocker classification, pause/abort, SHIPPABLE, CLOSED, or RELEASED authority.",
      "Automatic commit, stash, reset, discard, data migration, auth/security policy change, license change, external listener, Team/DAG, or public SaaS.",
      "Reopening or modifying v1.4.0 CLOSED history."
    ],
