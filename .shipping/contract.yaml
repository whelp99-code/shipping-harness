{
  "acceptance": [
    {
      "id": "AC-11101",
      "description": "OMP main-harness install, doctor, backup, and rollback tests pass.",
      "type": "command",
      "command": "node --test --test-reporter=spec test/omp-main-harness/*.test.mjs",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 300
    },
    {
      "id": "AC-11102",
      "description": "Current OMP host version/smoke and isolated nine-tool configuration field smoke passes.",
      "type": "command",
      "command": "node packages/omp-main-harness/field-smoke.mjs --check",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 300
    },
    {
      "id": "AC-11103",
      "description": "All MCP and OMP compatibility tests pass.",
      "type": "command",
      "command": "npm run test:mcp",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 360
    },
    {
      "id": "AC-11104",
      "description": "Full release, security, license, stable-control, and documentation verification passes.",
      "type": "command",
      "command": "npm run release:verify",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 900
    }
  ],
  "adapters": {
    "codex": {
      "artifactPaths": [],
      "command": null
    },
    "gajae": {
      "artifactPaths": [],
      "command": null
    },
    "generic": {
      "artifactPaths": [],
      "command": null
    },
    "omo": {
      "artifactPaths": [],
      "command": null
    },
    "ouroboros": {
      "artifactPaths": [],
      "command": null
    }
  },
  "blockerPolicy": [
    "acceptance-failure",
    "contract-tamper",
    "stale-evidence",
    "scope-drift",
    "data-loss",
    "critical-security",
    "human-stop-override",
    "automatic-approval",
    "model-self-approval",
    "raw-command-surface",
    "public-listener",
    "false-user-state",
    "hidden-blocker",
    "unbounded-card-content",
    "installer-path-escape",
    "destructive-migration",
    "migration-without-rollback",
    "unsupported-schema-accepted",
    "compatibility-fabrication",
    "terminal-state-replay",
    "internal-boundary-violation",
    "missing-handover",
    "missing-fallback-renderer"
  ],
  "budgets": {
    "maxAgentRuns": 3,
    "maxCommandSeconds": 600,
    "maxFixCycles": 2,
    "maxOutputBytes": 1048576
  },
  "goal": "Package and deploy the nine-tool Shipping Harness as OMP's main internal development harness, prove upgrade and rollback, and complete a non-destructive nested-project field pilot.",
  "project": "shipping-harness",
  "release": "1.1.1",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "requirements": [
    "REQ-OMP-MANAGER-001",
    "REQ-OMP-18-COMPAT-001",
    "REQ-OMP-BACKUP-001",
    "REQ-OMP-ROLLBACK-001",
    "REQ-OMP-APPROVAL-001",
    "REQ-OMP-DOCTOR-001",
    "REQ-FIELD-PILOT-001",
    "REQ-INSTALL-RECEIPT-001"
  ],
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Automatic target-project commit, stash, reset, merge, push, deployment, publication, purchase, or source modification.",
      "Automatic approval of a target proposal or execution of discovered target-project commands during the planning pilot.",
      "OMP core or omo-balance router source modification, OMP update, provider credential changes, or model routing changes.",
      "Team/DAG activation, public package publication, customer distribution, or public network listeners.",
      "Deleting previous OMP configuration, Shipping state, release receipts, or rollback packages."
    ],
    "include": [
      "Ship a reusable shipping-harness-omp command for preview, install, doctor, and rollback of the OMP main-harness integration.",
      "Detect and validate the current OMP 18.0.10 router/core environment while retaining tested MCP 2025-03-26 compatibility.",
      "Back up and atomically merge OMP MCP, approval, AGENTS, Skill, and install receipt files without touching project release state.",
      "Register all nine Shipping tools with always-ask authority and explicit prompt policy for refine, approval, execution, fixes, pause, and close.",
      "Provide deterministic isolated install/rollback tests, an actual OMP version/smoke gate, and a non-destructive nested-project planning pilot receipt.",
      "Package and document the v1.1.1 upgrade, fresh-shell doctor, rollback, and internal-only operating procedure."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "dist/**",
        "coverage/**",
        "node_modules/**"
      ],
      "include": [
        "README.md",
        "bin/shipping-harness-omp.mjs",
        "docs/COMPATIBILITY.md",
        "docs/MCP.md",
        "docs/operations/OMP-MAIN-HARNESS.md",
        "docs/planning/20-V1.1.1-OMP-FIELD-DEPLOYMENT-AND-PILOT-DEVELOPMENT-PLAN.md",
        "package.json",
        "packages/omp-main-harness/**",
        "packages/shipping-plugin/manifest/plugin.json",
        "packages/shipping-plugin/skill/SKILL.md",
        "packages/stable-control/compatibility.mjs",
        "schemas/v1/examples/mcp-surface.example.json",
        "schemas/v1/examples/plugin.example.json",
        "test/mcp/omp-compatibility.test.mjs",
        "test/omp-main-harness/**"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness"
}
