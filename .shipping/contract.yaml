  "adapters": {
    "codex": {
      "artifactPaths": [],
      "command": null
    },
    "gajae": {
      "artifactPaths": [],
      "command": null
    },
    "generic": {
      "artifactPaths": [],
      "command": null
    },
    "omo": {
      "artifactPaths": [],
      "command": null
    },
    "ouroboros": {
      "artifactPaths": [],
      "command": null
    }
  },
  "blockerPolicy": [
    "acceptance-failure",
    "contract-tamper",
    "stale-evidence",
    "scope-drift",
    "data-loss",
    "critical-security",
    "human-stop-override",
    "automatic-approval",
    "model-self-approval",
    "raw-command-surface",
    "public-listener",
    "false-user-state",
    "hidden-blocker",
    "unbounded-card-content",
    "installer-path-escape",
    "destructive-migration",
    "migration-without-rollback",
    "unsupported-schema-accepted",
    "compatibility-fabrication",
    "terminal-state-replay",
    "internal-boundary-violation",
    "missing-handover",
    "missing-fallback-renderer"
  ],
  "budgets": {
    "maxAgentRuns": 3,
    "maxCommandSeconds": 600,
    "maxFixCycles": 2,
    "maxOutputBytes": 1048576
  },
  "goal": "Prevent duplicate, mode-switched, dirty, unresolved, or weakly verified proposals from being presented or approved as ready.",
  "project": "shipping-harness",
  "release": "1.0.2",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "requirements": [
    "REQ-PROPOSAL-STATE-001",
    "REQ-PROPOSAL-IDEMPOTENCY-001",
    "REQ-MODE-AUTHORITY-001",
    "REQ-ACCEPTANCE-FLOOR-001",
    "REQ-PENDING-STATUS-001"
  ],
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Nested workspace scanning or selection.",
      "shipping_refine or any new user-facing MCP tool.",
      "Executing target project code during planning.",
      "Automatic commit, stash, reset, push, deploy, purchase, or publication.",
      "Changes to OMP source, private OMO runtime, Team/DAG, or remote protocol."
    ],
    "include": [
      "Derive one canonical proposal lifecycle state used by status and approval.",
      "Return the existing active proposal for materially identical shipping_start calls and audit supersession for changed requests.",
      "Keep AUTO mode unless an explicit user-authorized mode receipt permits a change.",
      "Reject weak fallback-only acceptance and dirty or unresolved proposals before approval.",
      "Expose pending proposal state and next action through shipping_status and the OMP skill."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "dist/**",
        "coverage/**",
        "node_modules/**"
      ],
      "include": [
        "README.md",
        "docs/COMPATIBILITY.md",
        "docs/MCP.md",
        "package-lock.json",
        "package.json",
        "packages/shipping-plugin/manifest/plugin.json",
        "packages/shipping-plugin/skill/SKILL.md",
        "src/core/decision-package.mjs",
        "src/core/proposal-state.mjs",
        "src/core/proposals.mjs",
        "src/mcp/tools.mjs",
        "src/mcp/user-view.mjs",
        "test/adversarial/**",
        "test/mcp/**",
        "test/usability/**"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness"
}
