  "project": "shipping-harness",
  "release": "1.9.0",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "requirements": [
    "REQ-PB-182-001",
    "REQ-PB-182-002",
    "REQ-PB-182-003",
    "REQ-PB-182-004",
    "REQ-PB-182-005",
    "REQ-PB-182-006"
  ],
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Increasing the 8192-byte product limit or weakening the quality gate.",
      "Removing the Action Envelope, forbidden action set, evidence references, or Shipping authority checks.",
      "Changing Goal Discovery, Goal Charter, Release Train, Autopilot, OMO runtime, model routing, or approval behavior.",
      "Publishing, deployment, customer contact, purchase, credential changes, or external writes.",
      "Mutating Orca-JARVIS product files or accepting its current baseline."
    ],
    "include": [
      "Remove only plain-brief fact projections that are zero-valued or mechanically derivable from canonical state, action envelope, or the separate Release Train summary.",
      "Preserve the full Action Envelope, exact next action, forbidden actions, mechanical evidence binding, fixed Korean sections, and modelAuthority=false.",
      "Add a regression fixture matching the Orca-JARVIS dirty baseline plus three unresolved Goal Discovery questions and four-release train.",
      "Require the real-world-shaped beginner report to remain healthy at no more than 7680 structured bytes while the hard product limit remains 8192 bytes.",
      "Keep the existing nine-tool MCP surface, OMP 18.0.10 compatibility, CLOSED != RELEASED, and all external-consequence boundaries."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "node_modules/**",
        "dist/**",
        "coverage/**"
      ],
      "include": [
        "package.json",
        "src/core/plain-brief.mjs",
        "test/mcp/plain-brief.test.mjs",
        "test/integration/plain-brief-budget.test.mjs",
        "docs/planning/32-V1.8.2-PLAIN-BRIEF-BUDGET-HOTFIX.md"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness"
