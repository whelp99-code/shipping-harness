  "schema": "shipping-harness/v1",
  "scope": {
    "include": [
      "Add stable default-deny autopilot policy, decision, and durable state documents with deterministic hashes.",
      "Classify each bounded Shipping action as exactly AUTO, NOTIFY, ASK, or STOP from mechanical consequence evidence.",
      "Allow one explicit LOCAL_REVERSIBLE policy authorization through the existing scope-approval tool while MANUAL remains default.",
      "Integrate policy decisions into existing execute, verify, blocker-fix, status, pause, and close paths without adding an MCP tool.",
      "Return bounded host-agent work orders for safe local implementation and exact mutation receipts; do not expose raw shell authority.",
      "Automatically close only a local release with proven value, required acceptance, rollback, fresh evidence, zero blockers/unknowns, and no scope drift.",
      "Keep production, public, customer, cost, license, destructive data, auth, security, and unknown consequences ASK or STOP.",
      "Separate CLOSED from RELEASED and keep automatic RELEASED permanently false in this release.",
      "Add durable recovery, duplicate-call idempotence, pause/abort precedence, replan signaling, Korean notifications, schemas, docs, and pilots.",
      "Update version and OMP compatibility surfaces to v1.6.0 only after all focused and full gates pass."
    ],
    "exclude": [
      "Production deploy, public release, customer communication, purchasing, paid service activation, or external network writes.",
      "Automatic destructive migration, data deletion, authentication/authorization weakening, security-policy change, license change, or secret handling.",
      "Raw shell, free-form policy, free-form future path, model-authored permission, unlimited retries, background execution, Team/DAG, or a tenth MCP tool.",
      "Treating CLOSED as RELEASED, bypassing current contracts, weakening acceptance, reopening closed history, or changing human pause/abort precedence.",
      "Automatically editing an arbitrary target project without a locked scope and bounded host work order."
    ],
