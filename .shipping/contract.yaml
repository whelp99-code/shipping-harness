{
  "acceptance": [
    {
      "command": "npm run lint",
      "cwd": ".",
      "description": "All source, MCP, planner, and test files pass repository lint checks.",
      "id": "AC-001",
      "required": true,
      "timeoutSeconds": 120,
      "type": "command"
    },
    {
      "command": "npm run typecheck",
      "cwd": ".",
      "description": "The module graph and package entrypoints resolve.",
      "id": "AC-002",
      "required": true,
      "timeoutSeconds": 120,
      "type": "command"
    },
    {
      "command": "npm run build",
      "cwd": ".",
      "description": "A distributable v0.3.0 tree with CLI and MCP binaries is produced.",
      "id": "AC-003",
      "required": true,
      "timeoutSeconds": 120,
      "type": "command"
    },
    {
      "command": "npm test",
      "cwd": ".",
      "description": "All unit, integration, adapter, MCP, and adversarial tests pass.",
      "id": "AC-004",
      "required": true,
      "timeoutSeconds": 420,
      "type": "command"
    },
    {
      "command": "npm run test:mcp",
      "cwd": ".",
      "description": "MCP protocol, tool schema, proposal approval, and STDIO transport tests pass independently.",
      "id": "AC-005",
      "required": true,
      "timeoutSeconds": 240,
      "type": "command"
    },
    {
      "command": "node scripts/mcp-smoke.mjs",
      "cwd": ".",
      "description": "A live local STDIO smoke client completes server discovery, tool listing, and read-only status invocation.",
      "id": "AC-006",
      "required": true,
      "timeoutSeconds": 120,
      "type": "command"
    },
    {
      "command": "npm run security",
      "cwd": ".",
      "description": "Security checks reject arbitrary command exposure, path escape, oversized messages, stale proposals, approval bypass, and secret leakage.",
      "id": "AC-007",
      "required": true,
      "timeoutSeconds": 120,
      "type": "command"
    },
    {
      "command": "npm run license:check",
      "cwd": ".",
      "description": "License and third-party interoperability boundaries remain valid.",
      "id": "AC-008",
      "required": true,
      "timeoutSeconds": 120,
      "type": "command"
    }
  ],
  "adapters": {
    "codex": {
      "artifactPaths": [],
      "command": null
    },
    "gajae": {
      "artifactPaths": [
        ".gjc/goals.json",
        ".gjc/ledger.jsonl",
        ".omc/ultragoal/goals.json",
        ".omc/ultragoal/ledger.jsonl"
      ],
      "command": null
    },
    "generic": {
      "artifactPaths": [],
      "command": null
    },
    "omo": {
      "artifactPaths": [
        ".omo/omo.jsonc",
        ".omo/omo.json"
      ],
      "command": null
    },
    "ouroboros": {
      "artifactPaths": [
        ".ouroboros/seed.json",
        ".ouroboros/ledger.jsonl",
        ".ouro/seed.json",
        ".ouro/ledger.jsonl"
      ],
      "command": null
    }
  },
  "blockerPolicy": [
    "acceptance-failure",
    "contract-tamper",
    "stale-evidence",
    "scope-drift",
    "data-loss",
    "critical-security",
    "capability-overclaim",
    "human-stop-override",
    "unbounded-continuation",
    "mcp-protocol-violation",
    "arbitrary-command-exposure",
    "stale-proposal",
    "approval-bypass"
  ],
  "budgets": {
    "maxAgentRuns": 3,
    "maxCommandSeconds": 900,
    "maxFixCycles": 2,
    "maxOutputBytes": 1048576
  },
  "goal": "일반 사용자가 CLI 세부사항 없이 MCP 연결 에이전트에게 자연어로 프로젝트 완료를 맡길 수 있도록, 로컬 STDIO MCP 서버·자동 최소 범위 초안·짧은 실행계획·안전한 Shipping Core 오케스트레이션을 제공한다.",
  "project": "shipping-harness",
  "release": "0.3.0",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Full Gajae deep interview, ralplan, ultragoal, tmux worker orchestration, or copied Gajae source.",
      "OMO multi-agent teams, model routing, autonomous role assignment, or native plugin emulation.",
      "Ouroboros evolutionary generations, ontology convergence, unbounded evaluate/evolve loops, or copied Ouroboros source.",
      "Remote HTTP MCP, OAuth, web UI, mobile UI, cloud control plane, multi-user/RBAC, automatic Git push, and deployment.",
      "Model-generated arbitrary shell execution, automatic contract approval, or bypassing human pause/abort."
    ],
    "include": [
      "A local newline-delimited JSON-RPC 2.0 STDIO MCP server compatible with MCP 2026-07-28 and the 2025-11-25 initialize handshake.",
      "High-level MCP tools for start, scope proposal approval, safe configured execution, verification/status, blocker-only fix cycles, pause, and close.",
      "Repository analysis that detects manifests, languages, package scripts, candidate acceptance commands, and proposes the smallest shippable scope from a natural-language goal.",
      "A short deterministic execution plan and a Git-SHA-bound proposal receipt that requires explicit approval before writing or locking a contract.",
      "MCP server discovery, tools/list, tools/call, ping, strict structured results, bounded input size, stderr-only logging, and protocol compatibility tests.",
      "Safe delegation to the existing Shipping Harness Core without exposing arbitrary shell command parameters through MCP.",
      "Local client configuration examples, installation documentation, security tests, adversarial tests, release evidence, and regression verification."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "dist/**",
        "coverage/**",
        "node_modules/**"
      ],
      "include": [
        "src/**",
        "bin/**",
        "scripts/**",
        "test/**",
        "docs/**",
        "README.md",
        "BACKLOG.md",
        "THIRD_PARTY.md",
        "LICENSE",
        "package.json"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness"
}
