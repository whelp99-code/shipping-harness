    },
    {
      "command": "npm run test:mcp",
      "cwd": ".",
      "description": "All MCP proposal and OMP compatibility tests pass.",
      "id": "AC-11202",
      "required": true,
      "timeoutSeconds": 360,
      "type": "command"
    },
    {
      "command": "npm run release:verify",
      "cwd": ".",
      "description": "Full regression, security, license, and documentation verification passes.",
      "id": "AC-11203",
      "required": true,
      "timeoutSeconds": 900,
      "type": "command"
    },
    {
      "command": "git diff --check",
      "cwd": ".",
      "description": "No whitespace or conflict-marker errors remain.",
      "id": "AC-11204",
      "required": true,
      "timeoutSeconds": 60,
      "type": "command"
    }
  ],
  "adapters": {
    "codex": {
      "artifactPaths": [],
      "command": null
    },
    "gajae": {
      "artifactPaths": [],
      "command": null
    },
    "generic": {
      "artifactPaths": [],
      "command": null
    },
    "omo": {
      "artifactPaths": [],
      "command": null
    },
    "ouroboros": {
      "artifactPaths": [],
      "command": null
    }
  },
  "blockerPolicy": [
    "acceptance-failure",
    "contract-tamper",
    "stale-evidence",
    "scope-drift",
    "data-loss",
    "critical-security",
    "human-stop-override",
    "automatic-approval",
    "model-self-approval",
    "raw-command-surface",
    "public-listener",
    "false-user-state",
    "hidden-blocker",
    "unbounded-card-content",
    "installer-path-escape",
    "destructive-migration",
    "migration-without-rollback",
    "unsupported-schema-accepted",
    "compatibility-fabrication",
    "terminal-state-replay",
    "internal-boundary-violation",
    "missing-handover",
    "missing-fallback-renderer"
  ],
  "budgets": {
    "maxAgentRuns": 3,
    "maxCommandSeconds": 600,
    "maxFixCycles": 2,
    "maxOutputBytes": 1048576
  },
  "goal": "Eliminate contradictory proposal approval states, preserve backward-compatible proposal reads, bind approval checks to canonical state, and prevent no-op refinement revisions.",
  "project": "shipping-harness",
  "release": "1.1.2",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "requirements": [
    "REQ-CANON-001",
    "REQ-CANON-002",
    "REQ-CANON-003",
    "REQ-CANON-004",
    "REQ-CANON-005",
    "REQ-CANON-006"
  ],
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Baseline commit, stash, reset, discard, or other Git mutation automation.",
      "Dirty-path classification, component graphs, work themes, and acceptance coverage implementation reserved for later releases.",
      "New MCP tools, OMP core/model-router changes, Team/DAG, push, deploy, publication, or public listeners.",
      "Rewriting historical proposal files merely to normalize their projection."
    ],
    "include": [
      "Make one canonical proposal state authoritative for every approval projection and gate.",
      "Safely project legacy contradictory proposal files without rewriting or hash damage.",
      "Include exact cwd in approval-brief acceptance rows.",
      "Prevent no-op refinement revisions while preserving meaningful immutable revision chains.",
      "Write the sequential v1.1.2, v1.2.0, and v1.3.0 plans; implement only v1.1.2 in this release.",
      "Preserve OMP 18.0.10 and 15.10.12 compatibility and the nine-tool MCP surface."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "dist/**",
        "coverage/**",
        "node_modules/**"
      ],
      "include": [
        "README.md",
        "docs/MCP.md",
        "docs/COMPATIBILITY.md",
        "docs/TRACEABILITY.md",
        "docs/planning/02-REQUIREMENTS.md",
        "docs/planning/09-SEQUENTIAL-ROADMAP-AND-DEVELOPMENT-PLAN.md",
        "docs/planning/21-V1.1.2-CANONICAL-PROPOSAL-STATE-DEVELOPMENT-PLAN.md",
        "docs/planning/22-V1.2.0-SAFE-BASELINE-STEWARD-DEVELOPMENT-PLAN.md",
        "docs/planning/23-V1.3.0-PROJECT-INTELLIGENCE-AND-ACCEPTANCE-COVERAGE-DEVELOPMENT-PLAN.md",
        "package.json",
        "src/core/proposal-state.mjs",
        "src/core/proposals.mjs",
        "src/core/decision-policy.mjs",
        "src/core/decision-package.mjs",
        "src/mcp/tools.mjs",
        "packages/shipping-plugin/manifest/plugin.json",
        "packages/shipping-plugin/skill/SKILL.md",
        "packages/stable-control/compatibility.mjs",
        "schemas/v1/examples/mcp-surface.example.json",
        "schemas/v1/examples/plugin.example.json",
        "test/mcp/canonical-proposal-state.test.mjs",
        "test/mcp/proposal-lifecycle.test.mjs",
        "test/mcp/nested-workspace-refine.test.mjs",
        "test/mcp/omp-compatibility.test.mjs",
        "test/plugin/renderers.test.mjs"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness"
}
