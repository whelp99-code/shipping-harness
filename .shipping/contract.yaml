      "Team/DAG activation, a tenth MCP tool, raw shell, arbitrary commands, Git push, merge, production deploy, purchase, customer contact, or public publish.",
      "Mutating real pilot repositories."
    ],
    "include": [
      "Analyze repository evidence before asking any discovery question.",
      "Compile zero to three material product-level questions with conservative reversible recommended choices.",
      "Allow explicit answers or delegated recommended defaults through the existing shipping_refine tool.",
      "Generate one to three deterministic direction candidates with value, non-goals, success criteria, risks, rollback, and replan triggers.",
