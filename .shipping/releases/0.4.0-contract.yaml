{
  "acceptance": [
    {
      "command": "npm run lint",
      "cwd": ".",
      "description": "All source, decision, MCP, and test files pass repository lint checks.",
      "id": "AC-001",
      "required": true,
      "timeoutSeconds": 120,
      "type": "command"
    },
    {
      "command": "npm run typecheck",
      "cwd": ".",
      "description": "The module graph and package entrypoints resolve.",
      "id": "AC-002",
      "required": true,
      "timeoutSeconds": 120,
      "type": "command"
    },
    {
      "command": "npm run build",
      "cwd": ".",
      "description": "A distributable v0.4.0 tree with CLI and MCP binaries is produced.",
      "id": "AC-003",
      "required": true,
      "timeoutSeconds": 120,
      "type": "command"
    },
    {
      "command": "npm test",
      "cwd": ".",
      "description": "All unit, integration, adapter, MCP, decision, and adversarial tests pass.",
      "id": "AC-004",
      "required": true,
      "timeoutSeconds": 480,
      "type": "command"
    },
    {
      "command": "npm run test:mcp",
      "cwd": ".",
      "description": "MCP protocol, tool, proposal, approval, and STDIO transport tests pass independently.",
      "id": "AC-005",
      "required": true,
      "timeoutSeconds": 240,
      "type": "command"
    },
    {
      "command": "npm run test:decision",
      "cwd": ".",
      "description": "Auto-decision modes, evidence, assumptions, risk escalation, approval brief, and policy tests pass independently.",
      "id": "AC-006",
      "required": true,
      "timeoutSeconds": 240,
      "type": "command"
    },
    {
      "command": "node scripts/mcp-smoke.mjs",
      "cwd": ".",
      "description": "A live local STDIO smoke client completes discovery, decision workflow entry, tool listing, and read-only status invocation.",
      "id": "AC-007",
      "required": true,
      "timeoutSeconds": 120,
      "type": "command"
    },
    {
      "command": "npm run security",
      "cwd": ".",
      "description": "Security checks reject command exposure, self-approval, policy bypass, stale decisions, prompt injection, path escape, oversized messages, and secret leakage.",
      "id": "AC-008",
      "required": true,
      "timeoutSeconds": 120,
      "type": "command"
    },
    {
      "command": "npm run license:check",
      "cwd": ".",
      "description": "License and third-party interoperability boundaries remain valid.",
      "id": "AC-009",
      "required": true,
      "timeoutSeconds": 120,
      "type": "command"
    }
  ],
  "adapters": {
    "codex": {
      "artifactPaths": [],
      "command": null
    },
    "gajae": {
      "artifactPaths": [
        ".gjc/goals.json",
        ".gjc/ledger.jsonl",
        ".omc/ultragoal/goals.json",
        ".omc/ultragoal/ledger.jsonl"
      ],
      "command": null
    },
    "generic": {
      "artifactPaths": [],
      "command": null
    },
    "omo": {
      "artifactPaths": [
        ".omo/omo.jsonc",
        ".omo/omo.json"
      ],
      "command": null
    },
    "ouroboros": {
      "artifactPaths": [
        ".ouroboros/seed.json",
        ".ouroboros/ledger.jsonl",
        ".ouro/seed.json",
        ".ouro/ledger.jsonl"
      ],
      "command": null
    }
  },
  "blockerPolicy": [
    "acceptance-failure",
    "contract-tamper",
    "stale-evidence",
    "scope-drift",
    "data-loss",
    "critical-security",
    "capability-overclaim",
    "human-stop-override",
    "unbounded-continuation",
    "mcp-protocol-violation",
    "arbitrary-command-exposure",
    "stale-proposal",
    "approval-bypass",
    "decision-policy-bypass",
    "unapproved-mandatory-risk",
    "model-self-approval",
    "repository-instruction-injection",
    "question-budget-exceeded"
  ],
  "budgets": {
    "maxAgentRuns": 3,
    "maxCommandSeconds": 900,
    "maxFixCycles": 2,
    "maxOutputBytes": 1048576
  },
  "goal": "Make AI decide the smallest operable release from repository evidence and user intent, ask only when a high-risk or irreversible decision cannot be safely inferred, present one approval brief, and preserve deterministic Shipping Harness governance.",
  "project": "shipping-harness",
  "release": "0.4.0",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Full Gajae deep interview, ralplan, ultragoal, tmux worker orchestration, or copied Gajae source.",
      "OMO multi-agent teams, autonomous model routing, parallel specialist execution, or native plugin emulation.",
      "Ouroboros evolutionary generations, ontology convergence, unbounded evaluate/evolve loops, or copied Ouroboros source.",
      "Embedded model-provider APIs, a proprietary reasoning model, or mandatory network model calls in the Shipping Harness core.",
      "Remote HTTP MCP, OAuth, plugin approval cards, mobile UI, cloud control plane, multi-user/RBAC, automatic Git push, and deployment.",
      "Model-generated arbitrary shell execution, model self-approval, automatic contract approval, or bypassing human pause/abort.",
      "Implementation of v0.5.0 or later roadmap items."
    ],
    "include": [
      "AUTO as the default decision mode, with explicit SAFE and INTERVIEW alternatives.",
      "A bounded repository decision evidence pack built without executing project code and with repository text treated as untrusted data.",
      "A model-agnostic structured decision protocol for a connected host agent to submit goals, scope, exclusions, acceptance, decisions, assumptions, evidence, confidence, reversibility, risks, and exception questions.",
      "Deterministic validation that rejects unrelated features, fabricated capabilities, unsupported commands, stale evidence, hidden scope growth, silent mode changes, and weakened Shipping Harness policy.",
      "Mandatory-risk escalation for destructive data, paid services, external impact, credentials/permissions, privacy/legal/compliance/critical-security, mutually exclusive core outcomes, and removal of critical compatibility promises.",
      "Safe documented assumptions for reversible low-risk uncertainty and a hard limit of three exception questions returned in one batch with recommended choices.",
      "A concise one-screen approval brief plus a separately inspectable detailed decision package.",
      "Proposal hashing that covers mode, decisions, assumptions, risks, questions, evidence, Git SHA, and expiry while preserving explicit user approval and proposer/approver separation.",
      "MCP, security, adversarial, regression, installation, and beginner-workflow documentation for the v0.4.0 decision flow."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "dist/**",
        "coverage/**",
        "node_modules/**"
      ],
      "include": [
        "src/**",
        "bin/**",
        "scripts/**",
        "test/**",
        "docs/**",
        "README.md",
        "BACKLOG.md",
        "THIRD_PARTY.md",
        "LICENSE",
        "package.json"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness"
}
