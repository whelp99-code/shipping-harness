{
  "schema": "shipping-harness/v1",
  "project": "shipping-harness",
  "worker": "shipping-harness",
  "release": "0.5.0",
  "goal": "Compile the locked release into durable Goal and Task state with append-only evidence, restart recovery, current-SHA completion proof, and bounded failure termination.",
  "scope": {
    "include": [
      "Deterministic compilation of the locked Shipping contract into stable Goal and Task records.",
      "Requirement and acceptance-consumer links for every Task, with orphan, duplicate, invalid dependency, and cycle rejection.",
      "Explicit bounded Goal and Task state machines, including DONE, BLOCKED, and PLANNING_STUCK terminal outcomes.",
      "Append-only execution ledger plus atomic Goal, Task, attempt, checkpoint, blocker, and evidence snapshots.",
      "Restart recovery that rebuilds state without replaying completed work or mutable commands.",
      "Current contract-hash and Git-SHA evidence freshness checks before any Goal or Task becomes DONE.",
      "Repeated-failure fingerprints, retry budgets, unchanged-state no-progress suppression, and changed-source bounded retry reset.",
      "Human pause and abort propagation above task recovery and continuation.",
      "Concise Goal and Task status integrated into CLI and MCP status while Shipping Finisher remains the only release closure authority.",
      "Offline unit, integration, adversarial, package-install, and real disposable-repository smoke validation for v0.5.0."
    ],
    "exclude": [
      "Multi-agent teams, model routing, background RPC child processes, OMO runtime integration, Team Mode, or DAG execution.",
      "Plugin installation UX, approval cards, mobile UI, remote HTTP MCP, OAuth, cloud services, or multi-user/RBAC.",
      "A general-purpose workflow engine, dynamic top-level graph expansion, or current-release evolution.",
      "Unlimited attempts, retries, depth, continuation, time, output, or cost.",
      "Goal or Task state overriding the locked Shipping contract, human pause/abort, blocker policy, Finisher, SHIPPABLE, or CLOSED.",
      "Implementation of v0.6.0 or later roadmap items."
    ],
    "paths": {
      "include": [
        "src/**",
        "bin/**",
        "scripts/**",
        "test/**",
        "docs/**",
        "README.md",
        "BACKLOG.md",
        "THIRD_PARTY.md",
        "LICENSE",
        "package.json"
      ],
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "dist/**",
        "coverage/**",
        "node_modules/**"
      ]
    }
  },
  "acceptance": [
    {
      "id": "AC-001",
      "description": "All source, Goal runtime, MCP, and test files pass repository lint checks.",
      "type": "command",
      "command": "npm run lint",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 120
    },
    {
      "id": "AC-002",
      "description": "The complete v0.5.0 module graph and package entrypoints resolve.",
      "type": "command",
      "command": "npm run typecheck",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 120
    },
    {
      "id": "AC-003",
      "description": "A distributable v0.5.0 tree with CLI and MCP binaries is produced.",
      "type": "command",
      "command": "npm run build",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 120
    },
    {
      "id": "AC-004",
      "description": "All unit, integration, adapter, MCP, decision, Goal runtime, and adversarial tests pass.",
      "type": "command",
      "command": "npm test",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 480
    },
    {
      "id": "AC-005",
      "description": "Goal/Task compilation, ledger, recovery, freshness, and failure-guard tests pass independently.",
      "type": "command",
      "command": "npm run test:goals",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 240
    },
    {
      "id": "AC-006",
      "description": "MCP protocol and Goal/Task status integration tests pass independently.",
      "type": "command",
      "command": "npm run test:mcp",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 240
    },
    {
      "id": "AC-007",
      "description": "Adversarial stale-proof, cycle, replay, retry, scope-reopen, pause, and ledger-corruption tests pass.",
      "type": "command",
      "command": "npm run test:adversarial",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 240
    },
    {
      "id": "AC-008",
      "description": "A disposable repository completes compile, checkpoint, interruption, restart recovery, fresh evidence, and DONE flow.",
      "type": "command",
      "command": "node scripts/goal-runtime-smoke.mjs",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 180
    },
    {
      "id": "AC-009",
      "description": "Security checks preserve contract, path, command, secret, human-stop, and Finisher boundaries.",
      "type": "command",
      "command": "npm run security",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 120
    },
    {
      "id": "AC-010",
      "description": "License and third-party interoperability boundaries remain valid.",
      "type": "command",
      "command": "npm run license:check",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 120
    }
  ],
  "blockerPolicy": [
    "acceptance-failure",
    "contract-tamper",
    "stale-evidence",
    "scope-drift",
    "data-loss",
    "critical-security",
    "human-stop-override",
    "unbounded-continuation",
    "goal-task-orphan",
    "goal-task-cycle",
    "invalid-goal-task-transition",
    "completed-work-replay",
    "stale-task-evidence",
    "unbounded-task-retry",
    "no-progress-retry",
    "goal-overrides-finisher",
    "ledger-corruption-without-diagnostic"
  ],
  "budgets": {
    "maxFixCycles": 2,
    "maxAgentRuns": 3,
    "maxCommandSeconds": 900,
    "maxOutputBytes": 1048576
  },
  "stopPolicy": {
    "humanInterruptWins": true,
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true
  },
  "releasePolicy": {
    "autoCommit": false,
    "autoTag": false,
    "autoPush": false,
    "generateReport": true
  },
  "adapters": {
    "generic": { "command": null, "artifactPaths": [] },
    "codex": { "command": null, "artifactPaths": [] },
    "gajae": {
      "command": null,
      "artifactPaths": [
        ".gjc/goals.json",
        ".gjc/ledger.jsonl",
        ".omc/ultragoal/goals.json",
        ".omc/ultragoal/ledger.jsonl"
      ]
    },
    "ouroboros": {
      "command": null,
      "artifactPaths": [
        ".ouroboros/seed.json",
        ".ouroboros/ledger.jsonl",
        ".ouro/seed.json",
        ".ouro/ledger.jsonl"
      ]
    },
    "omo": {
      "command": null,
      "artifactPaths": [".omo/omo.jsonc", ".omo/omo.json"]
    }
  }
}
