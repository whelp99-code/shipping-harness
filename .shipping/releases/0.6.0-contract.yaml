{
  "schema": "shipping-harness/v1",
  "project": "shipping-harness",
  "worker": "shipping-harness",
  "release": "0.6.0",
  "goal": "Let a non-developer install one local plugin bundle, ask an agent to finish a project, approve one concise brief, monitor truthful progress and blockers, pause safely, repair setup, and receive a closed release without project-specific CLI knowledge.",
  "scope": {
    "include": [
      "One local plugin bundle containing Shipping MCP registration profiles, a Shipping skill, concise agent instructions, lifecycle guidance, renderers, installer, uninstaller, doctor, and repair tools.",
      "A supported local Codex registration profile plus a generic MCP profile; all registration changes are explicit, bounded, previewable, and local-only.",
      "Natural-language start, one concise approval surface, truthful progress, blocker, completion, pause, abort, and detailed-evidence surfaces driven only by existing Shipping Core and MCP state.",
      "Plain-language user-state mapping that never reports CLOSED, SHIPPABLE, or success when the deterministic core disagrees.",
      "Project selection and repository readiness checks without scanning outside explicit allowlisted roots.",
      "Idempotent install, dry-run, doctor, repair, upgrade metadata, uninstall, and reinstall flows that preserve repository .shipping state.",
      "Fallback structured-text rendering when a host cannot display richer cards.",
      "No-CLI scripted beginner scenarios covering start, approve, status, pause/resume, blocker handling, verify, and close through MCP and plugin APIs.",
      "Offline unit, integration, usability, adversarial, package-install, and live local plugin smoke validation."
    ],
    "exclude": [
      "Remote HTTP MCP, public listeners, mobile access, cloud services, customer accounts, team RBAC, or web dashboards.",
      "Arbitrary shell, command, argv, environment, credential, deployment, push, purchase, or automatic-approval fields in plugin or MCP surfaces.",
      "OMO internal runtime, multi-agent teams, model routing, Team Mode, DAG execution, or v0.7 and later roadmap work.",
      "Automatic mutation of unrecognized host configuration formats or user-global files without explicit preview and confirmation.",
      "Deletion or reset of repository contracts, ledgers, evidence, release receipts, locked releases, or closed releases during repair, uninstall, upgrade, or reinstall.",
      "A public marketplace dependency or public package/runtime distribution."
    ],
    "paths": {
      "include": [
        "packages/**",
        "src/**",
        "bin/**",
        "scripts/**",
        "test/**",
        "docs/**",
        "README.md",
        "BACKLOG.md",
        "THIRD_PARTY.md",
        "LICENSE",
        "package.json"
      ],
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "dist/**",
        "coverage/**",
        "node_modules/**"
      ]
    }
  },
  "acceptance": [
    {
      "id": "AC-001",
      "description": "All plugin, renderer, installer, MCP, source, and test files pass lint.",
      "type": "command",
      "command": "npm run lint",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 120
    },
    {
      "id": "AC-002",
      "description": "The v0.6 module graph and package entrypoints resolve.",
      "type": "command",
      "command": "npm run typecheck",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 120
    },
    {
      "id": "AC-003",
      "description": "A distributable v0.6 package containing plugin assets, CLI, and MCP binaries is produced.",
      "type": "command",
      "command": "npm run build",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 120
    },
    {
      "id": "AC-004",
      "description": "All v0.1 through v0.6 unit, integration, adapter, MCP, decision, Goal, plugin, usability, and adversarial tests pass.",
      "type": "command",
      "command": "npm test",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 600
    },
    {
      "id": "AC-005",
      "description": "Plugin package, installer, manifest, skill, renderer, doctor, repair, uninstall, and reinstall tests pass independently.",
      "type": "command",
      "command": "npm run test:plugin",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 300
    },
    {
      "id": "AC-006",
      "description": "No-CLI non-developer usability scenarios pass independently.",
      "type": "command",
      "command": "npm run test:usability",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 300
    },
    {
      "id": "AC-007",
      "description": "MCP protocol and user-view integration tests pass independently.",
      "type": "command",
      "command": "npm run test:mcp",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 300
    },
    {
      "id": "AC-008",
      "description": "Adversarial self-approval, raw-command, hidden-blocker, false-state, path-escape, destructive-uninstall, and renderer-fallback tests pass.",
      "type": "command",
      "command": "npm run test:adversarial",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 300
    },
    {
      "id": "AC-009",
      "description": "An isolated packaged plugin installs, registers a disposable local host profile, discovers Shipping tools, completes a no-CLI beginner scenario, preserves state through uninstall/reinstall, and opens no listener.",
      "type": "command",
      "command": "node scripts/plugin-smoke.mjs",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 240
    },
    {
      "id": "AC-010",
      "description": "Security checks preserve local-only, no-shell, approval, human-stop, path, secret, and repository-state boundaries.",
      "type": "command",
      "command": "npm run security",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 120
    },
    {
      "id": "AC-011",
      "description": "License and third-party integration inventory remain valid.",
      "type": "command",
      "command": "npm run license:check",
      "cwd": ".",
      "required": true,
      "timeoutSeconds": 120
    }
  ],
  "blockerPolicy": [
    "acceptance-failure",
    "contract-tamper",
    "stale-evidence",
    "scope-drift",
    "data-loss",
    "critical-security",
    "human-stop-override",
    "automatic-approval",
    "model-self-approval",
    "raw-command-surface",
    "public-listener",
    "false-user-state",
    "hidden-blocker",
    "unbounded-card-content",
    "installer-path-escape",
    "destructive-repair",
    "destructive-uninstall",
    "repository-state-reset",
    "manual-json-required",
    "project-specific-cli-required",
    "missing-fallback-renderer"
  ],
  "budgets": {
    "maxFixCycles": 2,
    "maxAgentRuns": 3,
    "maxCommandSeconds": 900,
    "maxOutputBytes": 1048576
  },
  "stopPolicy": {
    "humanInterruptWins": true,
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true
  },
  "releasePolicy": {
    "autoCommit": false,
    "autoTag": false,
    "autoPush": false,
    "generateReport": true
  },
  "adapters": {
    "generic": { "command": null, "artifactPaths": [] },
    "codex": { "command": null, "artifactPaths": [] },
    "gajae": { "command": null, "artifactPaths": [] },
    "ouroboros": { "command": null, "artifactPaths": [] },
    "omo": { "command": null, "artifactPaths": [] }
  }
}
