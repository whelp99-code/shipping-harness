    "maxAgentRuns": 2,
    "maxCommandSeconds": 1200,
    "maxFixCycles": 2,
    "maxOutputBytes": 1048576
  },
  "goal": "Freeze Shipping Harness as a stable internal control plane with versioned schemas, explicit v0.6-v0.9 migration and compatibility, truthful health and event surfaces, reproducible package/plugin/OMO/remote verification, operations handover, and a closed v1.0.0 release without enabling Team/DAG or adding public/customer scope.",
  "project": "shipping-harness",
  "release": "1.0.0",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "requirements": [
    "REQ-STABLE-001",
    "REQ-STABLE-002",
    "REQ-STABLE-003",
    "REQ-OPS-001",
    "REQ-OPS-002",
    "REQ-BENCH-001",
    "REQ-BENCH-002",
    "REQ-SECURITY-001",
    "REQ-HANDOVER-001",
    "REQ-RELEASE-001"
  ],
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "New product capabilities, new Shipping actions, new remote endpoints, new adapter commands, model-provider integration, deployment, push, merge, purchase, or customer communication.",
      "Enabling Team Mode, DAG Mode, multi-agent orchestration, graph execution, role routing, or unlimited values.",
      "Public internet listener, public SaaS, marketplace distribution, customer tenants, resale, or customer installation of the integrated private OMO runtime.",
      "Automatic migration of unknown future schemas, destructive in-place migration, silent downgrade, or rollback without receipts.",
      "Changing v0.9 remote authorization, approval, replay, backup, or human-stop behavior except to fix a proven release blocker.",
      "Changing the promoted private OMO runtime source, tag, artifact, license boundary, or execution authority."
    ],
    "include": [
      "Versioned JSON schemas and examples for the stable contract, lock, state, evidence, Goal/Task, release, MCP, OMO bridge, internal remote, approval, notification, and backup boundaries.",
      "A stable-control library for schema registry, compatibility diagnostics, side-by-side migration, rollback receipts, health snapshots, and bounded internal event envelopes.",
      "Explicit compatibility and migration policy for supported v0.6.0 through v0.9.0 persisted state and component combinations.",
      "Final reproducible benchmark, security inventory, status report, documentation audit, isolated package install, and end-to-end smoke evidence.",
      "Installation, upgrade, rollback, backup, restore, observability, incident, recovery, retention, ownership, support, limitations, and handover documentation.",
      "Final package metadata, distribution contents, release notes, traceability, known limitations, and next-version backlog.",
      "Existing plugin/MCP, private OMO runtime, Team/DAG disabled decision, and internal remote behavior are regression-tested but not expanded."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "dist/**",
        "coverage/**",
        "node_modules/**",
        "packages/team-dag/**",
        "packages/internal-team/**",
        "packages/internal-dag/**",
        "packages/internal-remote/**",
        "packages/internal-omo-bridge/**",
        "src/mcp/**",
        "src/core/**",
        "bin/**"
      ],
      "include": [
        "BACKLOG.md",
        "README.md",
        "THIRD_PARTY.md",
        "config/upstreams/omo-pin.json",
        "docs/COMPATIBILITY.md",
        "docs/HANDOVER.md",
        "docs/MCP.md",
        "docs/MIGRATION.md",
        "docs/SECURITY-INVENTORY.md",
        "docs/TRACEABILITY.md",
        "docs/internal-runtime/OMO-RUNTIME.md",
        "docs/operations/**",
        "docs/reports/v1-*.json",
        "docs/reports/v1-*.md",
        "package.json",
        "packages/stable-control/**",
        "schemas/v1/**",
        "scripts/build.mjs",
        "scripts/v1-acceptance.mjs",
        "scripts/v1-completion-benchmark.mjs",
        "scripts/v1-doc-audit.mjs",
        "scripts/v1-final-smoke.mjs",
        "scripts/v1-security-inventory.mjs",
        "scripts/v1-status-report.mjs",
        "test/adversarial/stable-control-attacks.test.mjs",
        "test/plugin/doctor-repair.test.mjs",
        "test/stable/**"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness"
}
