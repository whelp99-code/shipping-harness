{
  "acceptance": [
    {
      "command": "node --test --test-reporter=spec test/mcp/omp-compatibility.test.mjs",
      "cwd": ".",
      "description": "OMP 15.10.12 protocol 2025-03-26 initializes and retains that negotiated version.",
      "id": "AC-10101",
      "required": true,
      "timeoutSeconds": 120,
      "type": "command"
    },
    {
      "command": "npm run test:mcp",
      "cwd": ".",
      "description": "Existing MCP latest and legacy regression suite passes.",
      "id": "AC-10102",
      "required": true,
      "timeoutSeconds": 300,
      "type": "command"
    },
    {
      "command": "npm run release:verify",
      "cwd": ".",
      "description": "All release tests and security checks pass without authority regression.",
      "id": "AC-10103",
      "required": true,
      "timeoutSeconds": 600,
      "type": "command"
    }
  ],
  "adapters": {
    "codex": {
      "artifactPaths": [],
      "command": null
    },
    "gajae": {
      "artifactPaths": [],
      "command": null
    },
    "generic": {
      "artifactPaths": [],
      "command": null
    },
    "omo": {
      "artifactPaths": [],
      "command": null
    },
    "ouroboros": {
      "artifactPaths": [],
      "command": null
    }
  },
  "blockerPolicy": [
    "acceptance-failure",
    "contract-tamper",
    "stale-evidence",
    "scope-drift",
    "data-loss",
    "critical-security",
    "human-stop-override",
    "automatic-approval",
    "model-self-approval",
    "raw-command-surface",
    "public-listener",
    "false-user-state",
    "hidden-blocker",
    "unbounded-card-content",
    "installer-path-escape",
    "destructive-migration",
    "migration-without-rollback",
    "unsupported-schema-accepted",
    "compatibility-fabrication",
    "terminal-state-replay",
    "internal-boundary-violation",
    "missing-handover",
    "missing-fallback-renderer"
  ],
  "budgets": {
    "maxAgentRuns": 3,
    "maxCommandSeconds": 600,
    "maxFixCycles": 2,
    "maxOutputBytes": 1048576
  },
  "goal": "Restore OMP MCP compatibility by supporting the protocol version OMP 15.10.12 actually negotiates, with no change to Shipping authority or tool behavior.",
  "project": "shipping-harness",
  "release": "1.0.1",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "requirements": [
    "REQ-MCP-COMPAT-001",
    "REQ-MCP-COMPAT-002",
    "REQ-MCP-COMPAT-003"
  ],
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "New Shipping tools or changed authority semantics",
      "Changes to OMP source code",
      "Team or DAG activation",
      "Remote protocol changes",
      "Public distribution or deployment"
    ],
    "include": [
      "MCP initialization compatibility for OMP 15.10.12 protocol 2025-03-26",
      "Regression tests for OMP-style initialize, tools/list, and shipping_status",
      "Compatibility documentation and v1.0.1 package version",
      "Corrected internal OMP bootstrap target and probes"
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "dist/**",
        "coverage/**",
        "node_modules/**"
      ],
      "include": [
        "README.md",
        "docs/COMPATIBILITY.md",
        "docs/MCP.md",
        "package.json",
        "packages/stable-control/compatibility.mjs",
        "scripts/v1-doc-audit.mjs",
        "src/mcp/protocol.mjs",
        "test/mcp/**"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness"
}
