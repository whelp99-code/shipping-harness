      "artifactPaths": [],
      "command": null
    }
  },
  "blockerPolicy": [
    "acceptance-failure",
    "contract-tamper",
    "stale-evidence",
    "scope-drift",
    "data-loss",
    "critical-security",
    "human-stop-override",
    "automatic-approval",
    "model-self-approval",
    "raw-command-surface",
    "public-listener",
    "false-user-state",
    "hidden-blocker",
    "unbounded-card-content",
    "installer-path-escape",
    "destructive-migration",
    "migration-without-rollback",
    "unsupported-schema-accepted",
    "compatibility-fabrication",
    "terminal-state-replay",
    "internal-boundary-violation",
    "missing-handover",
    "missing-fallback-renderer"
  ],
  "budgets": {
    "maxAgentRuns": 3,
    "maxCommandSeconds": 600,
    "maxFixCycles": 2,
    "maxOutputBytes": 1048576
  },
  "goal": "Detect the real nested product workspace, derive cwd-bound acceptance and version evidence, and refine one canonical proposal through a bounded ninth MCP tool.",
  "project": "shipping-harness",
  "release": "1.1.0",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "requirements": [
    "REQ-WORKSPACE-001",
    "REQ-WORKSPACE-002",
    "REQ-ACCEPTANCE-CWD-001",
    "REQ-VERSION-EVIDENCE-001",
    "REQ-PROPOSAL-REFINE-001",
    "REQ-REFINE-AUTHORITY-001"
  ],
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Executing discovered target-project commands during planning.",
      "Free-form or model-authored shell, argv, environment, credential, push, deploy, or publication fields.",
      "Automatic commit, stash, reset, merge, push, deploy, purchase, or target-project source changes.",
      "Orchestrating multiple products or workspaces in one release.",
      "OMP source modification, Team/DAG activation, public distribution, or remote protocol redesign."
    ],
    "include": [
      "Bounded tracked-file discovery and deterministic selection of the real nested runnable workspace.",
      "Manifest-derived verification and packaging commands with exact workspace-relative cwd and acceptance strength.",
      "Evidence-backed patch, minor, or major version recommendation without overriding explicit user versions.",
      "A ninth shipping_refine MCP tool that revises one canonical proposal identity using bounded structured answers and workspace selection.",
      "Immutable archived proposal revisions, active-index updates, OMP skill guidance, and nine-tool compatibility validation."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "dist/**",
        "coverage/**",
        "node_modules/**"
      ],
      "include": [
        "README.md",
        "docs/COMPATIBILITY.md",
        "docs/MCP.md",
        "package.json",
        "packages/shipping-plugin/manifest/plugin.json",
        "packages/shipping-plugin/skill/SKILL.md",
        "packages/stable-control/compatibility.mjs",
        "schemas/v1/**",
        "scripts/v1-doc-audit.mjs",
        "src/core/decision-evidence.mjs",
        "src/core/decision-package.mjs",
        "src/core/project-analysis.mjs",
        "src/core/proposal-state.mjs",
        "src/core/proposals.mjs",
        "src/mcp/protocol.mjs",
        "src/mcp/tools.mjs",
        "src/mcp/user-view.mjs",
        "test/adversarial/**",
        "test/mcp/**",
        "test/unit/**",
        "test/usability/**"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness"
}
