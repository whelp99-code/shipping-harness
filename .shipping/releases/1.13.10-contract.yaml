    "REQ-PB-182-003",
    "REQ-PB-182-004",
    "REQ-PB-182-005",
    "REQ-PB-182-006"
  ],
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Reopening a closed release.",
      "Letting a step that did not run report a plain PASS, or letting a release lock without saying what it may change.",
      "Rebuilding or reactivating the retired private OMO runtime.",
      "Publishing, deployment, customer contact, purchase, credential changes, or external writes."
    ],
    "include": [
      "A prepared draft states its own scope: prepare resets the scope statements and the path allowlist, and keeps only the structural denial list.",
      "A draft that never states what it may touch cannot be locked, because an empty allowlist is no restriction rather than a narrow one.",
      "A smoke that needs the retired private OMO runtime reports a countable skip and is a gate step instead of an exclusion."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "node_modules/**",
        "dist/**",
        "coverage/**"
      ],
