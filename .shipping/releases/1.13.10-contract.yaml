  "goal": "A release must state its own scope: prepare no longer copies the previous release's scope forward, and a draft that never says which paths it may change cannot be locked. Two smokes that need a retired runtime are gated as skips instead of excluded.",
  "project": "shipping-harness",
  "release": "1.13.10",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
