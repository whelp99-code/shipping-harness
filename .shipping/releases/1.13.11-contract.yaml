  "goal": "A close records that a release closed; it never decides which release an autopilot policy is bound to. A policy that authorised nothing here must keep saying so.",
  "project": "shipping-harness",
  "release": "1.13.11",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "requirements": [
    "REQ-PB-182-001",
    "REQ-PB-182-002",
    "REQ-PB-182-003",
    "REQ-PB-182-004",
    "REQ-PB-182-005",
    "REQ-PB-182-006"
  ],
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Reopening a closed release, or changing what a close does to the release state machine.",
      "Changing autopilot authority, profiles, or letting a model approve or close.",
      "Publishing, deployment, customer contact, purchase, credential changes, or external writes."
    ],
    "include": [
      "A close records that a release closed and never rewrites which release an autopilot policy is bound to.",
      "A policy that authorised nothing for the closing release keeps reporting spent and enabled false afterwards.",
      "The close record stays idempotent when the binding names an older release than the one closing."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "node_modules/**",
        "dist/**",
        "coverage/**"
      ],
      "include": [
        "CHANGELOG.md",
        "README.md",
        "docs/HANDOVER.md",
        "docs/planning/42-V1.13.11-A-CLOSE-DOES-NOT-REBIND-DEVELOPMENT-PLAN.md",
        "docs/reports/v1-security-inventory.json",
        "package.json",
        "src/core/autopilot.mjs",
        "test/autopilot/spent-policy-recovery.test.mjs"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness"
}
