  "goal": "A write-side fix cannot heal state already on disk. A policy bound to a release that has a closure receipt is spent whatever it is named, so bindings an older build already stamped recover when they are read.",
  "project": "shipping-harness",
  "release": "1.13.12",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "requirements": [
    "REQ-PB-182-001",
    "REQ-PB-182-002",
    "REQ-PB-182-003",
    "REQ-PB-182-004",
    "REQ-PB-182-005",
    "REQ-PB-182-006"
  ],
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Rewriting autopilot state on read, or repairing .shipping/ files in place.",
      "Widening what automation may act on, or letting a model approve or close.",
      "Reopening a closed release.",
      "Publishing, deployment, customer contact, purchase, credential changes, or external writes."
    ],
    "include": [
      "A policy bound to a release that has a closure receipt is spent whatever that release is named relative to the current one, so a binding an older build stamped recovers when it is read.",
      "A binding whose release has no closure receipt is still not spent and still fails closed.",
      "The recovery is proven from state produced by an older build, not from state this build wrote."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "node_modules/**",
        "dist/**",
        "coverage/**"
      ],
      "include": [
        "CHANGELOG.md",
        "README.md",
        "docs/HANDOVER.md",
        "docs/planning/43-V1.13.12-A-WRITE-SIDE-FIX-DOES-NOT-HEAL-DISK-DEVELOPMENT-PLAN.md",
        "docs/reports/v1-security-inventory.json",
        "package.json",
        "src/core/autopilot.mjs",
        "test/adversarial/autopilot-spent-policy.test.mjs",
        "test/autopilot/spent-policy-recovery.test.mjs"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness"
}
