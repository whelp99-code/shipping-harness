  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Changing what makes a plan file valid, or relaxing plan validation to accept MINOR.",
      "Refusing a proposal when no plan was requested and none is usable.",
      "Raising the plain brief byte budget, or trimming the canonical state or the next action.",
      "Reopening a closed release, or changing autopilot authority.",
      "Publishing, deployment, customer contact, purchase, credential changes, or external writes."
    ],
    "include": [
      "A caller that asked for a plan stage or plan path gets a refusal rather than a proposal built from something else.",
      "A plan discovered without being asked for still degrades to PATCH, and the degrade is stated in the plain brief a person reads.",
      "The approval screen renders the scope of the contract that will be locked, names the bound plan stage, and falls back to the derived scope when a stage states none.",
      "A brief that exceeds its byte budget trims facts from the end and records how many, instead of the whole projection being dropped."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "node_modules/**",
        "dist/**",
        "coverage/**"
