  "goal": "A diagnostic names what is wrong and what follows from it, so a reader is not left to discover the consequence by being surprised later.",
  "project": "shipping-harness",
  "release": "1.13.15",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
