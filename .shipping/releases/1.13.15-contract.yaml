  "requirements": [
    "REQ-PB-182-001",
    "REQ-PB-182-002",
    "REQ-PB-182-003",
    "REQ-PB-182-004",
    "REQ-PB-182-005",
    "REQ-PB-182-006"
  ],
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Changing which goal paths are refused, or which plan files are valid.",
      "Rewording errors outside these two diagnostics.",
      "Reopening a closed release.",
      "Publishing, deployment, customer contact, purchase, credential changes, or external writes."
    ],
    "include": [
      "PLAN_FILE_INVALID states that one invalid stage rejects the whole file and that the scope came from the derived template instead.",
      "GOAL_PATH_REFUSED states that the path is not in scope.paths.include and that changes there would read as scope drift.",
      "The token and reason carried by every refusal are unchanged, so the adversarial guarantees hold."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "node_modules/**",
        "dist/**",
        "coverage/**"
      ],
      "include": [
        "CHANGELOG.md",
        "README.md",
        "docs/HANDOVER.md",
        "docs/planning/46-V1.13.15-A-DIAGNOSTIC-STATES-ITS-CONSEQUENCE-DEVELOPMENT-PLAN.md",
        "package.json",
        "src/core/goal-paths.mjs",
        "src/core/plan-proposal.mjs",
        "test/adversarial/goal-scope-attacks.test.mjs",
        "test/unit/diagnostics-state-consequences.test.mjs"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness"
