  "goal": "A warning that fires on every correct release teaches the reader to skip warnings. The acceptance preflight states its measured fact once and names both readings, because which workflow produced the tree cannot be told from it.",
  "project": "shipping-harness",
  "release": "1.13.17",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "requirements": [
    "REQ-PB-182-001",
    "REQ-PB-182-002",
    "REQ-PB-182-003",
    "REQ-PB-182-004",
    "REQ-PB-182-005",
    "REQ-PB-182-006"
  ],
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Detecting which workflow produced the tree, or suppressing the warning in either case.",
      "Changing what the preflight runs, how it judges a criterion, or whether lock refuses.",
      "Publishing, deployment, customer contact, purchase, credential changes, or external writes."
    ],
    "include": [
      "The acceptance preflight warning names both readings of an already-passing criterion rather than asserting the stale one.",
      "The timeout warning says the criterion may be unrunnable and that verify would then fail for the environment rather than the work."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "node_modules/**",
        "dist/**",
        "coverage/**"
      ],
