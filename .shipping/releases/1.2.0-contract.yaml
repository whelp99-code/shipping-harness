{
  "acceptance": [
    {
      "command": "node --test --test-reporter=spec test/mcp/baseline-steward.test.mjs test/mcp/proposal-lifecycle.test.mjs test/mcp/nested-workspace-refine.test.mjs",
      "cwd": ".",
      "description": "Dirty classification, baseline plan, file-set handshake, and next-action tests pass.",
      "id": "AC-12001",
      "required": true,
      "timeoutSeconds": 300,
      "type": "command"
    },
    {
      "command": "npm run test:mcp",
      "cwd": ".",
      "description": "All MCP and OMP compatibility tests pass with nine tools.",
      "id": "AC-12002",
      "required": true,
      "timeoutSeconds": 360,
      "type": "command"
    },
    {
      "command": "npm run release:verify",
      "cwd": ".",
      "description": "Full regression, security, license, and documentation verification passes.",
      "id": "AC-12003",
      "required": true,
      "timeoutSeconds": 900,
      "type": "command"
    },
    {
      "command": "git diff --check",
      "cwd": ".",
      "description": "No whitespace or conflict-marker errors remain.",
      "id": "AC-12004",
      "required": true,
      "timeoutSeconds": 60,
      "type": "command"
    }
  ],
  "adapters": {
    "codex": {
      "artifactPaths": [],
      "command": null
    },
    "gajae": {
      "artifactPaths": [],
      "command": null
    },
    "generic": {
      "artifactPaths": [],
      "command": null
    },
    "omo": {
      "artifactPaths": [],
      "command": null
    },
    "ouroboros": {
      "artifactPaths": [],
      "command": null
    }
  },
  "blockerPolicy": [
    "acceptance-failure",
    "contract-tamper",
    "stale-evidence",
    "scope-drift",
    "data-loss",
    "critical-security",
    "human-stop-override",
    "automatic-approval",
    "model-self-approval",
    "raw-command-surface",
    "public-listener",
    "false-user-state",
    "hidden-blocker",
    "unbounded-card-content",
    "installer-path-escape",
    "destructive-migration",
    "migration-without-rollback",
    "unsupported-schema-accepted",
    "compatibility-fabrication",
    "terminal-state-replay",
    "internal-boundary-violation",
    "missing-handover",
    "missing-fallback-renderer"
  ],
  "budgets": {
    "maxAgentRuns": 3,
    "maxCommandSeconds": 600,
    "maxFixCycles": 2,
    "maxOutputBytes": 1048576
  },
  "goal": "Classify dirty work safely, present a bounded baseline preservation plan, and rescan the same proposal only after an explicitly approved host-side commit without exposing Git mutation through MCP.",
  "project": "shipping-harness",
  "release": "1.2.0",
  "releasePolicy": {
    "autoCommit": false,
    "autoPush": false,
    "autoTag": false,
    "generateReport": true
  },
  "requirements": [
    "REQ-BASE-001",
    "REQ-BASE-002",
    "REQ-BASE-003",
    "REQ-BASE-004",
    "REQ-BASE-005",
    "REQ-BASE-006"
  ],
  "schema": "shipping-harness/v1",
  "scope": {
    "exclude": [
      "Shipping-executed commit, stash, reset, clean, checkout, delete, discard, push, merge, or deploy.",
      "Automatic trust of tracked .omo, .senpi, .serena, generated, or ambiguous files.",
      "Component graphs, work themes, acceptance coverage, and isolated package execution reserved for v1.3.0.",
      "A tenth MCP tool, OMP core/model-router changes, Team/DAG, public publication, or public listeners."
    ],
    "include": [
      "Classify dirty entries as PRODUCT, RELEASE_EVIDENCE, AGENT_RUNTIME, SHIPPING_RUNTIME, GENERATED, or UNKNOWN using status and tracking evidence.",
      "Treat untracked agent/runtime and generated artifacts as visible non-blocking entries while tracked or unknown runtime entries remain blocking.",
      "Return a bounded baseline plan with exact included and excluded paths, rationale, suggested commit message, and a file-set hash.",
      "Return one canonical next action for each proposal state and remove destructive discard from beginner guidance.",
      "Require an explicit user-authorized baseline preservation handshake before accepting a post-commit rescan of a dirty proposal.",
      "Verify the reviewed file set equals the committed file set, keep the same proposal identity, and reject drift.",
      "Preserve the nine-tool MCP surface, OMP 18.0.10 compatibility, and all v1.1.2 canonical-state guarantees."
    ],
    "paths": {
      "exclude": [
        ".shipping/contract.yaml",
        ".shipping/contract.lock",
        ".git/**",
        "dist/**",
        "coverage/**",
        "node_modules/**"
      ],
      "include": [
        "README.md",
        "docs/MCP.md",
        "docs/COMPATIBILITY.md",
        "docs/TRACEABILITY.md",
        "docs/planning/02-REQUIREMENTS.md",
        "docs/planning/22-V1.2.0-SAFE-BASELINE-STEWARD-DEVELOPMENT-PLAN.md",
        "package.json",
        "src/core/baseline.mjs",
        "src/core/decision-evidence.mjs",
        "src/core/proposal-state.mjs",
        "src/core/proposals.mjs",
        "src/mcp/tools.mjs",
        "src/mcp/user-view.mjs",
        "packages/shipping-plugin/manifest/plugin.json",
        "packages/shipping-plugin/skill/SKILL.md",
        "packages/stable-control/compatibility.mjs",
        "schemas/v1/examples/plugin.example.json",
        "test/mcp/baseline-steward.test.mjs",
        "test/mcp/proposal-lifecycle.test.mjs",
        "test/mcp/nested-workspace-refine.test.mjs",
        "test/mcp/omp-compatibility.test.mjs"
      ]
    }
  },
  "stopPolicy": {
    "autoContinueAfterInterrupt": false,
    "closeWhenRequiredGatesPass": true,
    "humanInterruptWins": true
  },
  "worker": "shipping-harness"
}
